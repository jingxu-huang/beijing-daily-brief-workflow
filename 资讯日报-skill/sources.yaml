    - 出海
    - 游戏
    - 短剧
    - 漫剧
    - 网文
    - 社交
    - dating
    - AI
    - 大模型
    - 融资
    - 估值
    - 财报
    - 下载
    - 流水
    - DAU
    - MAU
    - IPO
    - gaming
    - game creation
    - interactive
    - prompt-to-game
    - vibe-coded
    - 提示词生成
    - 互动体验
    - 游戏创作
  exclude:
    - 招聘
    - 课程报名
    - 直播预告
    # —— 具身/机器人方向：现阶段先不看 ——
    - 具身
    - 人形
    - 机械臂
    - 机器狗
    - 四足
    - 双足
    - 灵巧手
    - 仿生
    - 宇树
    - 智元
    - 机器人
  # 保护词：含这些短语时不因"机器人"被误杀（其实是AI助手/对话产品）
  exclude_protect:
    - 聊天机器人
    - 对话机器人
    - 客服机器人
    - 机器人流程
